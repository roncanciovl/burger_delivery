# Ajustes de slam_toolbox (online async) para mapear la celda con un TurtleBot3 u otro
# AGV con LiDAR 2D. Se superponen a los valores por defecto del paquete.
slam_toolbox:
  ros__parameters:
    mode: mapping
    map_frame: map
    odom_frame: odom
    base_frame: base_footprint
    scan_topic: /scan
    # Celda pequeña: resolución fina y recorridos cortos entre actualizaciones.
    resolution: 0.02
    max_laser_range: 3.5
    minimum_travel_distance: 0.10
    minimum_travel_heading: 0.20
    map_update_interval: 2.0
    transform_publish_period: 0.05
    do_loop_closing: true
