# Ajustes de Nav2 para un carrito pequeño en la celda (~0.25 m de diámetro, 0.15 m/s).
# Se aplican ENCIMA de nav2_bringup/params/nav2_params.yaml: sólo se listan diferencias.
controller_server:
  ros__parameters:
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.12
      lookahead_dist: 0.25
      min_lookahead_dist: 0.10
      max_lookahead_dist: 0.40
      rotate_to_heading_angular_vel: 0.8
      use_rotate_to_heading: true
    general_goal_checker:
      xy_goal_tolerance: 0.03
      yaw_goal_tolerance: 0.12
local_costmap:
  local_costmap:
    ros__parameters:
      width: 1
      height: 1
      resolution: 0.02
      robot_radius: 0.13
      inflation_layer:
        inflation_radius: 0.15
global_costmap:
  global_costmap:
    ros__parameters:
      resolution: 0.02
      robot_radius: 0.13
      inflation_layer:
        inflation_radius: 0.15
velocity_smoother:
  ros__parameters:
    max_velocity: [0.15, 0.0, 1.0]
    min_velocity: [-0.10, 0.0, -1.0]
