name: ROS 2 CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install package dependencies
        shell: bash
        run: |
          apt-get update
          rosdep update
          # kortex_bringup NO existe como paquete apt: lo aporta el stack ros2_kortex,
          # que se clona en el workspace y se compila desde fuente. En el laboratorio
          # `rosdep --ignore-src` lo salta porque está en src/; aquí sólo se clona este
          # repositorio, así que hay que declararlo explícitamente como omitido o rosdep
          # intenta `apt-get install ros-jazzy-kortex-bringup` y falla.
          rosdep install --from-paths . --ignore-src --rosdistro jazzy -r -y \
            --skip-keys "kortex_bringup"

      - name: Build
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --event-handlers console_direct+

      - name: Test
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          colcon test --event-handlers console_direct+
          colcon test-result --verbose
